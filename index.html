<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hiệu quả khai thác đội xe bồn – Tháng 9/2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF2F5; --surface:#FFFFFF; --ink:#12222F; --muted:#5A6B7A; --line:#D8E0E7;
  --accent:#0B7285; --accent-ink:#FFFFFF; --warn-bg:#FFF4D6; --warn-ink:#7A4B00;
  --cell0:#E6ECF1; --soft:#F6F8FA; --bad:#B42318;
  --font:'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1822; --surface:#14232F; --ink:#E6EDF3; --muted:#9BABB9; --line:#27394A;
    --accent:#35B5CC; --accent-ink:#06222A; --warn-bg:#3A2E0D; --warn-ink:#F4D58A;
    --cell0:#1C2E3B; --soft:#112029; --bad:#FF8A80;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1822; --surface:#14232F; --ink:#E6EDF3; --muted:#9BABB9; --line:#27394A;
  --accent:#35B5CC; --accent-ink:#06222A; --warn-bg:#3A2E0D; --warn-ink:#F4D58A;
  --cell0:#1C2E3B; --soft:#112029; --bad:#FF8A80;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;padding:18px 20px 56px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.top h1{margin:0;font-size:24px;line-height:1.25;font-weight:700;letter-spacing:-.01em}
.top p{margin:2px 0 0;color:var(--muted);font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:9px 14px;margin-bottom:12px;font-weight:500;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}

/* filters */
.filters{display:flex;gap:18px 28px;flex-wrap:wrap;align-items:flex-end;padding:12px 0 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:6px}
.f-group{display:flex;flex-direction:column;gap:5px}
.f-group>span{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 9px;font-size:13.5px;font-weight:500}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block;border:2px solid var(--c)}
.chip[aria-pressed="false"]{color:var(--muted)}
.chip[aria-pressed="false"] i{background:transparent}
.f-inline{display:flex;gap:6px;align-items:center}
.f-inline select,.f-inline input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;min-width:64px}
.f-inline input{width:72px}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 -4px 18px;padding:6px 4px 0}
.tab{border:0;background:transparent;padding:9px 14px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}

/* blocks */
h2{font-size:18px;margin:26px 0 10px;font-weight:600;letter-spacing:-.005em}
h2:first-child{margin-top:0}
h3{font-size:15px;margin:0 0 8px;font-weight:600}
.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g2>*,.g3>*{min-width:0}
@media (max-width:960px){.g2,.g3{grid-template-columns:1fr}}
.chart{position:relative;height:300px}
.chart.tall{height:360px}
.note{color:var(--muted);font-size:13px}
.insights{margin:0 0 18px;padding:0;list-style:none;display:grid;gap:6px}
.insights li{padding:8px 12px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 8px 8px 0}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:18px;overflow:hidden}
.kpi{padding:14px 16px;border-left:1px solid var(--line);border-top:1px solid var(--line);margin:-1px 0 0 -1px}
.kpi .v{font-size:26px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.kpi .v small{font-size:14px;font-weight:500;color:var(--muted);margin-left:3px}
.kpi .l{font-size:13px;color:var(--muted);margin-top:2px}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:4px}
.kpi.empty .v{color:var(--muted);font-size:18px;font-weight:500}

/* heatmap */
.hm-scroll{overflow-x:auto;padding-bottom:4px}
.hm{display:grid;grid-template-columns:116px repeat(var(--cols),minmax(30px,1fr));gap:3px;min-width:calc(116px + var(--cols)*33px)}
.hm .h{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.2;padding:2px 0}
.hm .h.we{color:var(--ink);font-weight:600}
.hm .rl{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;white-space:nowrap}
.hm .rl i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.hm .c{border:0;height:34px;border-radius:4px;background:var(--cell0);font-size:11px;font-weight:600;color:var(--ink);padding:0}
.hm .c.hi{color:var(--accent-ink)}
.hm .c.sel{outline:2px solid var(--ink);outline-offset:1px}
.hm .cnt{font-size:12px;text-align:center;color:var(--muted);padding-top:3px}
.legend{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend .bar{width:140px;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--cell0),var(--accent))}
.detail{margin-top:10px;padding:10px 12px;background:var(--soft);border-radius:8px;font-size:13.5px;min-height:42px}

/* tables */
.scroll{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{font-weight:600;color:var(--muted);font-size:12.5px;background:var(--soft);position:sticky;top:0}
.tbl th.s{cursor:pointer}
.tbl th.s:hover{color:var(--ink)}
.tbl td.n,.tbl th.n{text-align:right}
.tbl tr:last-child td{border-bottom:0}
.tbl tfoot td{font-weight:600;border-top:2px solid var(--line);background:var(--soft)}
.tbl .xe{display:inline-flex;align-items:center;gap:7px;font-weight:500}
.tbl .xe i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.dim{color:var(--muted)}
.bar-cell{display:inline-block;height:8px;border-radius:4px;background:var(--accent);vertical-align:middle;margin-right:6px;opacity:.85}

/* import */
.imp textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:13px;resize:vertical}
.imp .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.imp code,.fmt code{background:var(--soft);padding:1px 6px;border-radius:4px;font-size:12.5px}
.msg{margin-top:8px;font-size:13.5px}
.msg.ok{color:var(--accent)}
.msg.err{color:var(--bad)}
.empty-state{text-align:center;padding:26px 16px;color:var(--muted)}
.empty-state strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
select.sel{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 6px;font-size:13px}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--muted);margin-left:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.price{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 0}
.price input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;width:130px}
.present .wrap{max-width:1500px}
.present body,.present{font-size:17px}
@media (max-width:640px){.wrap{padding:12px 12px 48px}.top h1{font-size:20px}.kpi .v{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

</div>

function splitLines(text){
  return text.split(/\r?\n/).map(l=>l.replace(/\s+$/,'')).filter(l=>l.trim()).map(l=>{
    const c=l.includes('\t')?l.split('\t'):(l.includes(';')?l.split(';'):l.split(/\s{2,}/));
    return c.map(s=>s.trim());
  });
}
function matchXe(s){
  const n=String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!n) return null;
  return XE.find(x=>x.toUpperCase().replace(/[^A-Z0-9]/g,'')===n)||null;
}
function parseDay(s){
  s=String(s||'').trim(); if(!s) return {e:'trống'};
  let m;
  if((m=s.match(/^(\d{1,2})$/))){ const d=+m[1]; return d>=1&&d<=31?{d}:{e:'ngày không hợp lệ'}; }
  if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))){ return +m[2]===9&&+m[1]===2026?{d:+m[3]}:{e:'ngoài tháng 9/2026'}; }
  if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})(?:[-\/.](\d{2,4}))?/))){
    let a=+m[1], b=+m[2], y=m[3]?+m[3]:2026; if(y<100) y+=2000;
    if(y!==2026) return {e:'ngoài tháng 9/2026'};
    if(b===9) return {d:a};
    if(a===9) return {d:b};
    return {e:'ngoài tháng 9/2026'};
  }
  return {e:'không nhận ra ngày'};
}
function parseNum(s){
  if(s==null) return null; s=String(s).trim().replace(/[đĐ₫\s]|VND|vnd|lít|l$/g,''); if(!s||!/^[-\d.,]+$/.test(s)) return null;
  const dots=(s.match(/\./g)||[]).length, commas=(s.match(/,/g)||[]).length;
  let t=s;
  if(dots&&commas){ const dec=s.lastIndexOf('.')>s.lastIndexOf(',')?'.':','; t=dec==='.'?s.replace(/,/g,''):s.replace(/\./g,'').replace(',','.'); }
  else if(dots>1||commas>1){ t=s.replace(/[.,]/g,''); }
  else if(dots===1||commas===1){ const sep=dots?'.':','; const tail=s.split(sep)[1]; t=(tail.length===3)?s.replace(sep,''):s.replace(sep,'.'); }
  const v=parseFloat(t); return isFinite(v)?v:null;
}
function parseTime(s){
  const m=String(s||'').match(/(\d{1,2})\s*[:hH]\s*(\d{2})/); return m?(+m[1]*60+ +m[2]):null;
}
function lead(cells){ // đổi chỗ nếu biển số đứng trước ngày

  return cells;
}
function isHeader(c){ return !parseDay(c[0]).d && !matchAsset(c[0]) && !matchAsset(c[1]) && !/^(tổng|tháng|total)/i.test(c[0]||''); }

      const xe=matchXe(c[1]); if(!xe){errs.push('Dòng '+(i+1)+': không khớp biển số "'+(c[1]||'')+'"');return;}
      let d=0; if(c[0]&&!/^(tổng|tháng|total)/i.test(c[0])){ const p=parseDay(c[0]); if(p.e){errs.push('Dòng '+(i+1)+': '+p.e);return;} d=p.d; }
      const l=parseNum(c[2]); if(!(l>0)){errs.push('Dòng '+(i+1)+': số lít không hợp lệ');return;}
      const cost=parseNum(c[3])||0;
      rows.push({d,x:xe,l,cost});
    });
    return {rows,errs};
  },
  rev(text){
    const rows=[],errs=[];
    splitLines(text).forEach((c0,i)=>{
      let c=lead(c0); if(i===0&&isHeader(c)) return;
      const xe=matchAsset(c[1]); if(!xe){errs.push('Dòng '+(i+1)+': không khớp biển số "'+(c[1]||'')+'"');return;}
      if((assetOf(xe)||{}).t==='tau'){errs.push('Dòng '+(i+1)+': '+xe+' là tàu, nhập ở tab Tàu / Sà lan');return;}
      const p=parseDay(c[0]); if(p.e){errs.push('Dòng '+(i+1)+': '+p.e);return;}
      let route='',amt,vol=0;
      if(c.length<=3&&parseNum(c[2])!=null){ amt=parseNum(c[2]); }
      else { route=c[2]||''; amt=parseNum(c[3]); vol=parseNum(c[4])||0; }
      if(!(amt>0)){errs.push('Dòng '+(i+1)+': doanh thu không hợp lệ');return;}
      rows.push({d:p.d,x:xe,route,amt,vol,dr:(c.length>5?(c[5]||''):'').trim(),km1:parseNum(c[6])||0,cust:(c[7]||'').trim()});
    });
    return {rows,errs};
  },
  evt(text){
    const rows=[],errs=[];
    splitLines(text).forEach((c0,i)=>{
      let c=lead(c0); if(i===0&&isHeader(c)) return;
      const xe=matchXe(c[1]); if(!xe){errs.push('Dòng '+(i+1)+': không khớp biển số "'+(c[1]||'')+'"');return;}
      const p=parseDay(c[0]); if(p.e){errs.push('Dòng '+(i+1)+': '+p.e);return;}
      const s=parseTime(c[2]), e=parseTime(c[3]); if(s==null||e==null){errs.push('Dòng '+(i+1)+': giờ bắt đầu/kết thúc không hợp lệ');return;}
      let dur=e-s; if(dur<0) dur+=1440;
      const loc=c[4]||''; let t=null,auto=true;
      const raw=(c[5]||'').toLowerCase();
      if(raw){ auto=false; t=/trưa|ăn/.test(raw)?'Ăn trưa':/nhiên|xăng|dầu|đổ/.test(raw)?'Tiếp nhiên liệu':'Nghỉ khác'; }
      else t=classify(s,dur,loc);
      rows.push({d:p.d,x:xe,s,dur,loc,t,auto});
    });
    return {rows,errs};
  }
};
function classify(s,dur,loc){
  if(/(cây|trạm|cửa hàng)\s*xăng|tiếp nhiên liệu|đổ (xăng|dầu|nhiên liệu)/i.test(loc)) return 'Tiếp nhiên liệu';
  if(s>=630&&s<=810&&dur>=20&&dur<=120) return 'Ăn trưa';
  return 'Nghỉ khác';
}

function makeDemo(){
  let seed=20260901; const rnd=()=>{ seed=(seed*1664525+1013904223)%4294967296; return seed/4294967296; };
  const fuel=[],rev=[],evt=[];
  const routes=['Kho Nhà Bè → CHXD','Kho Nhà Bè → Đồng Nai','Kho Nhà Bè → Vĩnh Long','Kho Nhà Bè → Cần Thơ','Kho Nhà Bè → Lâm Đồng'];
  DATA.forEach(r=>{
    if(r.km<5) return;
    fuel.push({d:r.d,x:r.x,l:+(r.km*(0.31+rnd()*0.09)).toFixed(1),cost:0});
    const n=r.km<110?1:r.km<260?1+Math.round(rnd()):2+Math.round(rnd());
    for(let k=0;k<n;k++) rev.push({d:r.d,x:r.x,route:routes[Math.floor(rnd()*routes.length)],amt:Math.round((6+rnd()*12)*1e6/1e4)*1e4,vol:Math.round(10+rnd()*20)*1000});
    if(r.span>5*3600){
      const ls=660+Math.round(rnd()*60), ld=25+Math.round(rnd()*40);
      evt.push({d:r.d,x:r.x,s:ls,dur:ld,loc:'',t:'Ăn trưa',auto:true});
      if(rnd()>.45) evt.push({d:r.d,x:r.x,s:480+Math.round(rnd()*300),dur:10+Math.round(rnd()*15),loc:'Trạm xăng',t:'Tiếp nhiên liệu',auto:true});
      const o=Math.round(rnd()*2); for(let k=0;k<o;k++) evt.push({d:r.d,x:r.x,s:420+Math.round(rnd()*600),dur:10+Math.round(rnd()*35),loc:'',t:'Nghỉ khác',auto:true});
    }
  });
  return {fuel,rev,evt};
}

const inRange=d=>d>=st.from&&d<=st.to;
const R=()=>DATA.filter(r=>st.sel.has(r.x)&&inRange(r.d));
const isAct=r=>r.km>=st.thr;

function V(){
  const rs=R(), m={};
  XE.forEach(x=>{ if(st.sel.has(x)) m[x]={x,km:0,aKm:0,days:0,act:0,use:0,idle:0,move:0,offs:0,stops:0,over:0,vmax:0,aUse:0,aIdle:0,aMove:0,aOffs:0,aStops:0}; });
  rs.forEach(r=>{
    const o=m[r.x]; o.days++; o.km+=r.km; o.use+=r.use; o.idle+=r.idle; o.move+=r.move; o.offs+=r.offs; o.stops+=r.st; o.over+=r.ov; o.vmax=Math.max(o.vmax,r.vm);
    if(isAct(r)){ o.act++; o.aKm+=r.km; o.aUse+=r.use; o.aIdle+=r.idle; o.aMove+=r.move; o.aOffs+=r.offs; o.aStops+=r.st; }
  });
  const F=getFuel(), RV=getRev(), CM=costModel();
  return Object.values(m).map(o=>{
    const cr=CM.byX[o.x]; o.kmM=cr?cr.km:0; o.cost=cr&&cr.total>0?cr.total:null; o.cpk=cr&&cr.cpk?cr.cpk:null;
    const fd=F.filter(f=>f.x===o.x&&f.d>0&&inRange(f.d));
    const fm=F.filter(f=>f.x===o.x&&f.d===0);
    const cost=f=>f.cost>0?f.cost:(st.price>0?f.l*st.price:0);
    if(fd.length){
      const ds=new Set(fd.map(f=>f.d));
      o.fuel=sum(fd,'l'); o.fuelCost=sum(fd,cost); o.fuelKm=rs.filter(r=>r.x===o.x&&ds.has(r.d)).reduce((a,r)=>a+r.km,0); o.fuelDays=ds.size;
    } else if(fm.length&&st.from===1&&st.to===MAXD){
      o.fuel=sum(fm,'l'); o.fuelCost=sum(fm,cost); o.fuelKm=o.km; o.fuelDays=o.act;
    } else { o.fuel=null; o.fuelCost=0; o.fuelKm=0; o.fuelDays=0; }
    const rv=RV.filter(t=>t.x===o.x&&inRange(t.d));
    o.rev=rv.length?sum(rv,'amt'):null; o.trips=sum(rv,tn); o.vol=sum(rv,'vol');
    o.l100=o.fuel!=null&&o.fuelKm>0?o.fuel/o.fuelKm*100:null;
    return o;
  });
}
function tot(vs){
  const t={km:0,aKm:0,days:0,act:0,use:0,idle:0,move:0,offs:0,stops:0,aStops:0,over:0,vmax:0,fuel:null,fuelKm:0,fuelCost:0,rev:null,trips:0,vol:0,cost:null,kmM:0};
  vs.forEach(o=>{
    ['km','aKm','days','act','use','idle','move','offs','stops','aStops','over','trips','vol'].forEach(k=>t[k]+=o[k]);
    t.vmax=Math.max(t.vmax,o.vmax);
    if(o.fuel!=null){ t.fuel=(t.fuel||0)+o.fuel; t.fuelKm+=o.fuelKm; t.fuelCost+=o.fuelCost; }
    if(o.rev!=null){ t.rev=(t.rev||0)+o.rev; }
    t.kmM+=o.kmM; if(o.cost!=null) t.cost=(t.cost||0)+o.cost;
  });
  t.l100=t.fuel!=null&&t.fuelKm>0?t.fuel/t.fuelKm*100:null;
  return t;
}

function insights(vs,t){
  const L=[]; const nd=nDays(), slots=vs.length*nd; if(!vs.length||!slots) return L;
  const top=[...vs].sort((a,b)=>b.km-a.km)[0];
  L.push('Đội xe chạy <b>'+nf(t.km)+' km</b>. Xe '+esc(top.x)+' chạy nhiều nhất với <b>'+nf(top.km)+' km</b> ('+pct(top.km,t.km)+' tổng quãng đường).');
  L.push('Mỗi xe mỗi ngày tính là 1 "ngày-xe": '+vs.length+' xe × '+nd+' ngày = '+slots+' ngày-xe. Chỉ <b>'+t.act+' ngày-xe ('+pct(t.act,slots)+')</b> có chạy từ '+st.thr+' km trở lên, tức trung bình <b>'+nf(t.act/nd,1)+' xe</b> hoạt động mỗi ngày trong số '+vs.length+' xe.');
  const low=[...vs].sort((a,b)=>a.act-b.act)[0];
  if(vs.length>1) L.push('Xe '+esc(low.x)+' ít hoạt động nhất: <b>'+low.act+' ngày chạy</b> trong '+nd+' ngày.');
  const idl=[...vs].filter(o=>o.use>0).sort((a,b)=>b.idle/b.use-a.idle/a.use)[0];
  if(idl) L.push('Xe '+esc(idl.x)+' có <b>'+pct(idl.idle,idl.use)+'</b> thời gian nổ máy là đứng yên (dừng nổ máy: '+nf(hrs(idl.idle),1)+' giờ).');
  const zero=dayList().filter(d=>!R().some(r=>r.d===d&&isAct(r))).length;
  if(zero>0) L.push('Có <b>'+zero+' ngày</b> trong khoảng đã chọn không có xe nào chạy từ '+st.thr+' km.');
  if(t.over>0) L.push('Ghi nhận <b>'+t.over+' lần vượt tốc</b>; tốc độ cao nhất '+t.vmax+' km/h.');
  if(t.rev>0&&t.trips>0) L.push('Bảng kê doanh thu tháng 9 ghi nhận <b>'+money(t.rev)+' đ</b> từ <b>'+t.trips+' chuyến</b>'+(t.vol>0?' ('+nf(t.vol)+' lít, cước bình quân '+nf(t.rev/t.vol,1)+' đ/lít)':'')+(st.demo?' (số mẫu)':'')+'.');
  if(t.cost>0&&t.kmM>0){ const nlc=sum(vs.map(o=>costModel().byX[o.x]).filter(Boolean),o=>o.direct.nl); L.push('Chi phí vận hành cả tháng (gồm thu nhập tài xế tạm tính) của các xe đang chọn là <b>'+money(t.cost)+' đ</b> (<b>'+nf(t.cost/t.kmM)+' đ/km</b>), nhiên liệu chiếm '+pct(nlc,t.cost)+'.'); }
  return L;
}

function vehTable(vs,t){

/* ---------- Phương tiện, chi phí, tài xế, tàu ---------- */
const normP=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const PLATE_RE=/(\d{2}[A-Z]\s*-?\s*\d{3}\s*[.\-]?\s*\d{2}|[A-Z]{2}\s*-?\s*\d{3}\s*[.\-]?\s*\d{2})/i;
function plateFmt(s){ const n=normP(s); const m=n.match(/^(\d{2}[A-Z]|[A-Z]{2})(\d{3})(\d{2})$/); return m?m[1]+'-'+m[2]+'.'+m[3]:String(s||'').toUpperCase().trim(); }
const ASSETS=()=>XE.map(x=>({x:x,t:'xe',gps:1})).concat(BASE_NONGPS.map(a=>Object.assign({gps:0},a)),st.extra.map(a=>Object.assign({gps:0},a)));
const assetOf=x=>ASSETS().find(a=>a.x===x)||null;
function matchAsset(s){ const n=normP(s); if(!n) return null; const a=ASSETS().find(q=>normP(q.x)===n); return a?a.x:null; }
const visible=a=>!a.gps||st.sel.has(a.x);
const isFull=()=>st.from===1&&st.to===MAXD;
const msgHtml=k=>st.msg[k]?'<div class="msg '+(st.msg[k].ok?'ok':'err')+'">'+st.msg[k].t+'</div>':'';
function assetTag(o){ return xeTag(o.x)+(o.t==='tau'?'<span class="tag">tàu</span>':(o.gps?'':'<span class="tag">chưa có GPS</span>')); }

let _rdKey=null,_rdMap={};
function rdMap(){ if(_rdKey!==st.rev){ _rdMap={}; st.rev.forEach(r=>{ if(r.dr){ const k=r.x+'|'+r.d; if(!_rdMap[k]) _rdMap[k]=r.dr; } }); _rdKey=st.rev; } return _rdMap; }
function drvOf(x,d){
  const rd=rdMap()[x+'|'+d]; if(rd) return {name:rd,known:true};
  const cov=st.assign.filter(a=>a.x===x&&a.from!=null&&d>=a.from&&d<=a.to).sort((a,b)=>b.from-a.from);
  return cov.length?{name:cov[0].dr,known:true}:{name:'',known:false};
}
const drvLabel=(x,d)=>{ const q=drvOf(x,d); return q.known?q.name:'Chưa chia ngày · '+x; };

function kmAllMap(){ const m={}; DATA.forEach(r=>{ m[r.x]=(m[r.x]||0)+r.km; }); return m; }
function costModel(){
  const km=kmAllMap(); const base=sum(Object.values(km),v=>v);
  const rows=ASSETS().map(a=>{
    const o={x:a.x,t:a.t,gps:a.gps,n:a.n||'',km:km[a.x]||0,direct:{},alloc:{},drivers:[],rev:0,trips:0};
    CATS.forEach(c=>{ o.direct[c[0]]=0; o.alloc[c[0]]=0; }); o.direct.tx=0; o.alloc.tx=0;
    return o;
  });
  const byX={}; rows.forEach(o=>{ byX[o.x]=o; });
  st.cost.forEach(c=>{ const o=byX[c.x]; if(!o) return; CATS.forEach(k=>{ o.direct[k[0]]+=(c.v&&c.v[k[0]])||0; }); if(c.dr&&!o.drivers.includes(c.dr)) o.drivers.push(c.dr); });
  st.assign.forEach(a=>{ const o=byX[a.x]; if(o&&a.dr&&!o.drivers.includes(a.dr)) o.drivers.push(a.dr); });
  const unalloc={};
  CATS.forEach(c=>{ const p=st.pool[c[0]]||0; if(p>0){ if(base>0) rows.forEach(o=>{ o.alloc[c[0]]=p*o.km/base; }); else unalloc[c[0]]=p; } });
  getRev().forEach(r=>{ const o=byX[r.x]; if(o){ o.rev+=r.amt; o.trips+=tn(r); } });
  st.tau.forEach(r=>{ const o=byX[r.x]; if(o){ o.rev+=r.amt||0; o.trips+=tn(r); } });
  const PM=payModel();
  rows.forEach(o=>{ const q=PM.byX[o.x]; o.txBase=q?q.base:0; o.txTrip=q?q.trip:0; o.direct.tx=o.txBase+o.txTrip; });
  rows.forEach(o=>{
    o.allocSum=sum(CATS,c=>o.alloc[c[0]]);
    o.total=sum(CATS_ALL,c=>o.direct[c[0]]+o.alloc[c[0]]);
    o.cpk=o.km>0&&o.total>0?o.total/o.km:null;
    o.profit=o.rev>0?o.rev-o.total:null;
  });
  return {rows:rows,byX:byX,base:base,unalloc:unalloc};
}

/* ---------- Thu nhập tài xế tạm tính ---------- */
function payTier(km){ const L=st.pay.lim; if(km<L[0]) return 0; if(km<L[1]) return 1; if(km<=L[2]) return 2; return 3; }
const payAmt=km=>st.pay.amt[payTier(km)];
const tierLabel=i=>{ const L=st.pay.lim; return ['Dưới '+L[0]+' km',L[0]+' đến dưới '+L[1]+' km',L[1]+' đến '+L[2]+' km','Trên '+L[2]+' km'][i]; };
function baseRegion(){
  const cnt={}; DATA.forEach(r=>{ cnt[r.x]=cnt[r.x]||{}; cnt[r.x][r.r0]=(cnt[r.x][r.r0]||0)+1; });
  const b={}; Object.keys(cnt).forEach(x=>{ b[x]=Object.keys(cnt[x]).sort((p,q)=>cnt[x][q]-cnt[x][p])[0]; });
  return b;
}
function payModel(){
  const P=st.pay, BR=baseRegion(), trips=[];
  const realBy={}; st.rev.forEach(r=>{ const k=r.x+'|'+r.d; for(let i=0;i<tn(r);i++) (realBy[k]=realBy[k]||[]).push(r); });
  const rowBy={}; DATA.forEach(r=>{ rowBy[r.x+'|'+r.d]=r; });
  const mergedOut={}, carryKm={};
  DATA.forEach(r=>{ const k=r.x+'|'+r.d, b=BR[r.x];
    if(realBy[k]&&r.r0!==b&&r.r1===b){ const p=rowBy[r.x+'|'+(r.d-1)]; if(p&&p.r0===b&&p.r1!==b&&p.km>=P.minKm&&!realBy[p.x+'|'+p.d]){ mergedOut[p.x+'|'+p.d]=true; carryKm[k]=p.km; } } });
  DATA.forEach(r=>{
    const real=realBy[r.x+'|'+r.d];
    if(r.km<P.minKm&&!real) return;
    const b=BR[r.x]; let kind,est;
    if(r.r0===b&&r.r1===b){ kind='Đi giao và về bãi trong ngày, lấy một nửa km'; est=r.km/2; }
    else if(r.r0===b){ kind='Đi giao, cuối ngày còn ở ngoài, lấy toàn bộ km'; est=r.km; }
    else if(r.r1===b){ kind='Chiều về bãi, không tính'; est=0; }
    else { kind='Chạy giữa các điểm ngoài bãi, lấy toàn bộ km'; est=r.km; }
    const base={x:r.x,d:r.d,r0:r.r0,r1:r.r1,kmDay:r.km,kind:kind};
    if(mergedOut[r.x+'|'+r.d]){ trips.push(Object.assign({},base,{km1:0,pay:0,dr:'',skip:true,kind:'Chiều đi xa, tính chung với chuyến có doanh thu ngày hôm sau',src:'Ước tính từ GPS'})); return; }
    if(real){
      const ck=carryKm[r.x+'|'+r.d]; if(ck) base.kind='Chuyến đi xa: km một lượt lấy theo chiều đi ngày hôm trước';
      const n=real.length, e=ck?ck/n:(est>0?est/n:r.km/2/n);
      real.forEach(t=>{ const km1=t.km1>0?t.km1:e; trips.push(Object.assign({},base,{km1:km1,pay:payAmt(km1),dr:t.dr||'',src:t.km1>0?'Km thực tế đã nhập':'Có doanh thu, km ước tính'})); });
    } else if(est>0){
      trips.push(Object.assign({},base,{km1:est,pay:payAmt(est),dr:'',src:'Ước tính từ GPS'}));
    } else {
      trips.push(Object.assign({},base,{km1:0,pay:0,dr:'',skip:true,src:'Ước tính từ GPS'}));
    }
  });
  const drivers={};
  const ensure=n=>drivers[n]||(drivers[n]={name:n,xs:[],base:0,n:0,tripPay:0,tier:[0,0,0,0],unres:n.indexOf('Chưa chia ngày')===0});
  const link=(o,x)=>{ if(x&&!o.xs.includes(x)) o.xs.push(x); };
  st.cost.forEach(c=>{ if(!c.dr) return; const a=assetOf(c.x); if(a&&a.t==='tau') return; link(ensure(c.dr),c.x); });
  st.assign.forEach(a=>{ if(a.dr) link(ensure(a.dr),a.x); });
  trips.forEach(t=>{
    const q=drvOf(t.x,t.d); t.who=t.dr||(q.known?q.name:'Chưa chia ngày · '+t.x);
    if(t.skip) return;
    const o=ensure(t.who); link(o,t.x); o.n++; o.tripPay+=t.pay; o.tier[payTier(t.km1)]++;
  });
  Object.values(drivers).forEach(o=>{ if(!o.unres) o.base=P.base; o.total=o.base+o.tripPay; });
  const byX={}; const add=(x,v,k)=>{ byX[x]=byX[x]||{base:0,trip:0}; byX[x][k]+=v; };
  trips.forEach(t=>{ if(!t.skip) add(t.x,t.pay,'trip'); });
  const kmDx={}; DATA.forEach(r=>{ const q=drvOf(r.x,r.d); if(q.known){ kmDx[q.name]=kmDx[q.name]||{}; kmDx[q.name][r.x]=(kmDx[q.name][r.x]||0)+r.km; } });
  Object.values(drivers).forEach(o=>{
    if(o.unres||!o.base||!o.xs.length) return;
    const w=o.xs.map(x=>(kmDx[o.name]&&kmDx[o.name][x])||0), sw=sum(w,v=>v);
    o.xs.forEach((x,i)=>add(x,sw>0?o.base*w[i]/sw:o.base/o.xs.length,'base'));
  });
  return {drivers:Object.values(drivers),trips:trips,byX:byX,BR:BR};
}

function drvAgg(){
  const map={}; const CM=costModel();
  const get=k=>map[k]||(map[k]={name:k,xs:[],km:0,act:0,use:0,idle:0,stops:0,over:0,days:0,direct:0,alloc:0,inc:0,nTrips:0,kmM:0,rev:0,trips:0,unres:k.indexOf('Chưa chia ngày')===0});
  const addX=(o,x)=>{ if(x&&!o.xs.includes(x)) o.xs.push(x); };
  R().forEach(r=>{ const o=get(drvLabel(r.x,r.d)); addX(o,r.x); o.days++; o.km+=r.km; o.use+=r.use; o.idle+=r.idle; o.stops+=r.st; o.over+=r.ov; if(isAct(r)) o.act++; });
  let totKm=0; const kmM={};
  DATA.forEach(r=>{ totKm+=r.km; if(st.sel.has(r.x)){ const k=drvLabel(r.x,r.d); kmM[k]=(kmM[k]||0)+r.km; } });
  Object.keys(kmM).forEach(k=>{ get(k).kmM=kmM[k]; });
  st.cost.forEach(c=>{ if(!c.dr) return; const a=assetOf(c.x); if(a&&a.gps&&!st.sel.has(c.x)) return; const o=get(c.dr); addX(o,c.x); o.direct+=sum(CATS,k=>(c.v&&c.v[k[0]])||0); });
  const P=sum(CATS,k=>st.pool[k[0]]||0);
  if(P>0&&totKm>0) Object.keys(kmM).forEach(k=>{ map[k].alloc=P*kmM[k]/totKm; });
  getRev().filter(r=>inRange(r.d)).forEach(r=>{ const a=assetOf(r.x); if(a&&a.gps&&!st.sel.has(r.x)) return; const o=get(r.dr||drvLabel(r.x,r.d)); addX(o,r.x); o.rev+=r.amt; o.trips+=tn(r); });
  st.tau.filter(r=>inRange(r.d)).forEach(r=>{ const o=get(r.dr||drvLabel(r.x,r.d)); addX(o,r.x); o.rev+=r.amt||0; o.trips+=tn(r); });
  const PMd={}; payModel().drivers.forEach(q=>{ PMd[q.name]=q; });
  Object.keys(map).forEach(k=>{ const q=PMd[k]; map[k].inc=q?q.total:0; map[k].nTrips=q?q.n:0; });
  return Object.values(map).map(o=>{ o.cost=o.direct+o.alloc+o.inc; o.cpk=o.kmM>0&&o.cost>0?o.cost/o.kmM:null; return o; });
}

/* ---------- đọc dữ liệu: chi phí, phân công, tàu ---------- */
PARSERS.cost=function(text){
  const rows=[],errs=[]; let totals=null;
  splitLines(text).forEach((c,i)=>{
    const label=c[0]||'';
    if(/^(tổng|total)/i.test(label.trim())){ totals={}; CATS.forEach((k,j)=>{ totals[k[0]]=parseNum(c[j+1])||0; }); return; }
    const m=label.match(PLATE_RE);
    if(!m){ if(/tài xế|bsk|biển/i.test(label)||!label.trim()) return; errs.push('Dòng '+(i+1)+': không thấy biển số trong "'+label+'"'); return; }
    const plate=plateFmt(m[0]);
    const dr=label.replace(m[0],' ').replace(/sà\s*lan|tàu/ig,' ').replace(/[-–—:|,]+/g,' ').replace(/\s+/g,' ').trim();
    const t=(/sà\s*lan|tàu/i.test(label)||/^SG/.test(normP(plate)))?'tau':'xe';
    const v={}; CATS.forEach((k,j)=>{ const n=parseNum(c[j+1]); if(n) v[k[0]]=n; });
    rows.push({x:plate,dr:dr,v:v,t:t});
  });
  const pool={};
  if(totals) CATS.forEach(k=>{ const d=totals[k[0]]-sum(rows,r=>(r.v[k[0]]||0)); if(d>0.5) pool[k[0]]=Math.round(d); });
  return {rows:rows,errs:errs,pool:pool};
};
PARSERS.assign=function(text){
  const rows=[],errs=[];
  splitLines(text).forEach((c,i)=>{
    const x=matchAsset(c[0]); if(!x){ if(i===0) return; errs.push('Dòng '+(i+1)+': không khớp phương tiện "'+(c[0]||'')+'"'); return; }
    const dr=(c[1]||'').trim(); if(!dr){ errs.push('Dòng '+(i+1)+': thiếu tên tài xế'); return; }
    const a=c[2]?parseDay(c[2]):null, b=c[3]?parseDay(c[3]):null;
    if((a&&a.e)||(b&&b.e)){ errs.push('Dòng '+(i+1)+': ngày không hợp lệ'); return; }
    rows.push({x:x,dr:dr,from:a?a.d:(b?1:null),to:b?b.d:(a?MAXD:null)});
  });
  return {rows:rows,errs:errs};
};
PARSERS.tau=function(text){
  const rows=[],errs=[];
  splitLines(text).forEach((c0,i)=>{
    const c=lead(c0); if(i===0&&isHeader(c)) return;
    const x=matchAsset(c[1]); if(!x){ errs.push('Dòng '+(i+1)+': không khớp phương tiện "'+(c[1]||'')+'"'); return; }
    if((assetOf(x)||{}).t!=='tau'){ errs.push('Dòng '+(i+1)+': '+x+' không phải tàu, nhập ở tab Doanh thu'); return; }
    const p=parseDay(c[0]); if(p.e){ errs.push('Dòng '+(i+1)+': '+p.e); return; }
    const vol=parseNum(c[3])||0, hrs=parseNum(c[4])||0, amt=parseNum(c[5])||0, lit=parseNum(c[6])||0;
    if(!(vol>0||hrs>0||amt>0)){ errs.push('Dòng '+(i+1)+': chưa có khối lượng, giờ hoặc doanh thu'); return; }
    rows.push({d:p.d,x:x,route:c[2]||'',vol:vol,hrs:hrs,amt:amt,lit:lit,dr:(c[7]||'').trim()});
  });
  return {rows:rows,errs:errs};
};

/* ---------- khung chính ---------- */
const TABS=[['tong','Tổng quan'],['km','Quãng đường'],['time','Thời gian và nghỉ'],['fuel','Nhiên liệu'],['cost','Chi phí'],['rev','Doanh thu'],['drv','Tài xế'],['inc','Thu nhập tài xế'],['tau','Tàu / Sà lan'],['data','Dữ liệu và cách tính']];
const VIEWS={tong:[vTong,cTong],km:[vKm,cKm],time:[vTime,cTime],fuel:[vFuel,cFuel],cost:[vCost,cCost],rev:[vRev,cRev],drv:[vDrv,cDrv],inc:[vInc,cInc],tau:[vTau,cTau],data:[vData,null]};

function renderFilters(){
  const el=document.getElementById('filters');
  const dOpt=(v)=>Array.from({length:MAXD},(_,i)=>'<option value="'+(i+1)+'"'+(i+1===v?' selected':'')+'>'+(i+1)+'</option>').join('');
  el.innerHTML=
   '<div class="f-group"><span>Xe</span><div class="chips">'+XE.map(x=>'<button class="chip" style="--c:'+col(x)+'" data-act="xe" data-x="'+esc(x)+'" aria-pressed="'+st.sel.has(x)+'"><i></i>'+esc(x)+'</button>').join('')+'</div></div>'+
   '<div class="f-group"><span>Khoảng ngày (tháng 9)</span><div class="f-inline"><select id="from" aria-label="Từ ngày">'+dOpt(st.from)+'</select><span>đến</span><select id="to" aria-label="Đến ngày">'+dOpt(st.to)+'</select></div></div>'+
   '<div class="f-group"><span>Ngưỡng tính là ngày chạy (km)</span><div class="f-inline"><input type="number" id="thr" min="0" step="1" value="'+st.thr+'"></div></div>'+
   '<div class="f-group"><button class="btn ghost" data-act="reset">Đặt lại bộ lọc</button></div>';
}
function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(t=>{
    const dot=(t[0]==='fuel'&&getFuel().length)||(t[0]==='rev'&&getRev().length)?'<span class="dot" title="Đã có dữ liệu"></span>':'';
    return '<button class="tab" role="tab" data-act="tab" data-t="'+t[0]+'" aria-selected="'+(st.tab===t[0])+'">'+t[1]+dot+'</button>';
  }).join('');
}
function renderBanner(){
  document.getElementById('banner').innerHTML=st.demo?'<div class="banner"><span>Đang hiển thị dữ liệu mẫu cho nhiên liệu, doanh thu và điểm dừng. Đây là số giả lập để xem giao diện, không dùng để báo cáo.</span><button class="btn" data-act="demo">Tắt dữ liệu mẫu</button></div>':'';
  document.getElementById('btnDemo').textContent=st.demo?'Tắt dữ liệu mẫu':'Xem thử với dữ liệu mẫu';
}
function render(keepScroll){
  const y=window.scrollY;
  kill(); renderBanner(); renderFilters(); renderTabs();
  const v=VIEWS[st.tab]; document.getElementById('view').innerHTML=v[0]();
  if(v[1]) v[1]();
  if(keepScroll) window.scrollTo(0,y);
}

/* ---------- sự kiện ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act;
  if(a==='tab'){ st.tab=b.dataset.t; render(); window.scrollTo(0,0); }
  else if(a==='xe'){ const x=b.dataset.x; if(st.sel.has(x)) st.sel.delete(x); else st.sel.add(x); render(true); }
  else if(a==='reset'){ st.sel=new Set(XE); st.from=1; st.to=MAXD; st.thr=5; render(true); }
  else if(a==='pick'){ st.pick={x:b.dataset.x,d:+b.dataset.d}; render(true); }
  else if(a==='sort'){ const k=b.dataset.k; st.sort=st.sort.k===k?{k,dir:-st.sort.dir}:{k,dir:k==='x'?1:-1}; render(true); }
  else if(a==='tmode'){ st.timeMode=b.dataset.m; render(true); }
  else if(a==='demo'){ st.demo=!st.demo; render(true); }
  else if(a==='present'){ try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }catch(err){} document.documentElement.classList.toggle('present'); }
  else if(a==='apply'||a==='append'){ doImport(b.dataset.kind,a==='append'); }
  else if(a==='clear'){ const k=b.dataset.kind; st[k]=[]; save(k,[]); if(k==='cost'){ st.pool={}; save('pool',{}); } st.msg[k]={ok:true,t:'Đã xóa dữ liệu đã nhập.'}; render(true); }
  else if(a==='restorerev'){ st.rev=clone(BASE_REV); save('rev',st.rev); st.tau=clone(BASE_TAU); save('tau',st.tau); st.demo=false; st.msg.rev={ok:true,t:'Đã khôi phục bảng kê doanh thu tháng 9 của xe bồn ('+sum(st.rev,tn)+' chuyến) và sà lan ('+sum(st.tau,tn)+' chuyến).'}; render(true); }
  else if(a==='payreset'){ st.pay=clone(BASE_PAY); save('pay',st.pay); render(true); }
  else if(a==='restore'){ st.cost=clone(BASE_COST); st.pool=clone(BASE_POOL); st.assign=clone(BASE_ASSIGN); save('cost',st.cost); save('pool',st.pool); save('assign',st.assign); st.msg.cost={ok:true,t:'Đã khôi phục số liệu chi phí tháng 9 và phân công tài xế nhập sẵn.'}; render(true); }
  else if(a==='addasset'){
    const x=plateFmt((document.getElementById('addx')||{}).value||''); const t=(document.getElementById('addt')||{}).value||'xe';
    if(!x) st.msg.asset={ok:false,t:'Nhập biển số hoặc ký hiệu phương tiện.'};
    else if(matchAsset(x)) st.msg.asset={ok:false,t:'Phương tiện '+esc(x)+' đã có trong danh sách.'};
    else { st.extra.push({x:x,t:t}); save('extra',st.extra); st.msg.asset={ok:true,t:'Đã thêm '+esc(x)+'.'}; }
    render(true);
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='from'){ st.from=+t.value; if(st.from>st.to) st.to=st.from; render(true); }
  else if(t.id==='to'){ st.to=+t.value; if(st.to<st.from) st.from=st.to; render(true); }
  else if(t.id==='thr'){ st.thr=Math.max(0,+t.value||0); render(true); }
  else if(t.dataset&&t.dataset.pool){ const v=parseNum(t.value)||0; if(v>0) st.pool[t.dataset.pool]=v; else delete st.pool[t.dataset.pool]; save('pool',st.pool); render(true); }
  else if(t.dataset&&t.dataset.pay){ const v=parseNum(t.value), k=t.dataset.pay; if(v!=null&&v>=0){ if(k==='base'||k==='minKm') st.pay[k]=v; else if(k.indexOf('lim')===0) st.pay.lim[+k.slice(3)]=v; else if(k.indexOf('amt')===0) st.pay.amt[+k.slice(3)]=v; save('pay',st.pay); } render(true); }
  else if(t.id==='price'){ const v=parseNum(t.value)||0; st.price=v; save('price',v); render(true); }
  else if(t.dataset&&t.dataset.act==='settype'){ const e2=st.evt[+t.dataset.i]; if(e2){ e2.t=t.value; e2.auto=false; save('evt',st.evt); render(true); } }
});
document.addEventListener('input',e=>{ const t=e.target; if(t.tagName==='TEXTAREA'&&t.dataset.kind) st.draft[t.dataset.kind]=t.value; });
function doImport(kind,append){
  const text=st.draft[kind]||''; const res=PARSERS[kind](text);
  if(!res.rows.length){ st.msg[kind]={ok:false,t:'Chưa đọc được dòng nào. '+esc(res.errs[0]||'Hãy dán dữ liệu từ Excel rồi bấm lại.')}; render(true); return; }
  st.demo=false;
  let base=append?st[kind]:[];
  if(kind==='assign'&&!append){ const xs=new Set(res.rows.map(r=>r.x)); base=st.assign.filter(a=>!xs.has(a.x)); }
  st[kind]=base.concat(res.rows); save(kind,st[kind]); st.draft[kind]='';
  let extra='';
  if(kind==='cost'){
    const pool=append?Object.assign({},st.pool):{}; Object.keys(res.pool||{}).forEach(k=>{ pool[k]=res.pool[k]; }); st.pool=pool; save('pool',pool);
    const added=[]; res.rows.forEach(r=>{ if(!matchAsset(r.x)){ st.extra.push({x:r.x,t:r.t}); added.push(r.x); } });
    if(added.length){ save('extra',st.extra); extra+=' Đã thêm phương tiện mới: '+added.map(esc).join(', ')+'.'; }
    const pk=Object.keys(res.pool||{}); if(pk.length) extra+=' Số tổng chưa có chi tiết từng xe ('+pk.map(k=>CATS.find(c=>c[0]===k)[1]).join(', ')+') sẽ được chia theo km.';
  }
  st.msg[kind]={ok:true,t:'Đã đọc '+res.rows.length+' dòng'+(res.errs.length?'; bỏ qua '+res.errs.length+' dòng: '+res.errs.slice(0,4).map(esc).join('; ')+(res.errs.length>4?'…':''):'.')+extra};
  render(true);
}
const mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
if(mq&&mq.addEventListener) mq.addEventListener('change',()=>render(true));
new MutationObserver(()=>render(true)).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
render();
})();
</script>
